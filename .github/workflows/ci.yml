name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The trial tests start a fake game through a .bat and kill it with Windows tools.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel into a clean venv and run it
        shell: bash
        run: |
          python -m venv clean
          clean/Scripts/python -m pip install dist/*.whl
          clean/Scripts/rimbisect --version
          clean/Scripts/python -c "import importlib.resources as r; assert (r.files('rimbisect') / 'probe/Assemblies/RimbisectProbe.dll').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build rimbisect.exe from a clean venv
        shell: bash
        run: |
          python -m venv exe-venv
          exe-venv/Scripts/python -m pip install . "pyinstaller>=6.10,<7"
          exe-venv/Scripts/python -m PyInstaller --onefile --name rimbisect --collect-data rimbisect \
            --workpath build/pyi --specpath build --distpath dist/exe src/rimbisect/__main__.py
      - name: Run it and check the probe is inside
        shell: bash
        run: |
          dist/exe/rimbisect.exe --version
          exe-venv/Scripts/pyi-archive_viewer -l dist/exe/rimbisect.exe | grep -F RimbisectProbe.dll
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/exe/rimbisect.exe
