[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rimbisect"
version = "0.1.0"
description = "Find the RimWorld mod, or combination of mods, behind an error by relaunching the game on halves of your load order."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Christiaan Bosch", email = "cbosch101@gmail.com" }]
keywords = ["rimworld", "mods", "bisect", "modding", "load-order", "debugging", "troubleshooting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Debuggers",
]
dependencies = ["lxml>=5.2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Booyaka101/rimbisect"
Repository = "https://github.com/Booyaka101/rimbisect"
Issues = "https://github.com/Booyaka101/rimbisect/issues"
Changelog = "https://github.com/Booyaka101/rimbisect/blob/main/CHANGELOG.md"

[project.scripts]
rimbisect = "rimbisect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rimbisect"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "probe-src/*.cs", "probe-src/*.csproj", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
